<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discovery Nebrodi – Mappa 3D</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Crea la mappa centrata sui Nebrodi
  const map = L.map('map').setView([38.02, 14.70], 10);

  // Mappa OpenStreetMap
  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

L.marker([37.984268, 14.581352])
  .addTo(map)
  .bindPopup(`
    <div style="text-align:center; min-width:200px;">
      <h3 style="margin-bottom:5px;">Ponte dei Ninfi</h3>

      <p>
        Fotogrammetria 3D<br>
        Discovery Nebrodi
      </p>

      <a
        href="https://skfb.ly/pMEVL"
        target="_blank"
        style="
          display:inline-block;
          padding:10px 15px;
          background:#222;
          color:white;
          text-decoration:none;
          border-radius:6px;
          font-weight:bold;
        "
      >
        Esplora in 3D
      </a>
    </div>
  `);
</script>

</body>
</html>
