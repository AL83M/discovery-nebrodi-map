<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discovery Nebrodi – Mappa 3D</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #viewerOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #viewerBox {
      position: relative;
      width: 92%;
      height: 88%;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    #viewerFrame {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #closeViewer {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10000;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .open3d {
      display: inline-block;
      padding: 10px 15px;
      background: #222;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="viewerOverlay">
  <div id="viewerBox">
    <button id="closeViewer" onclick="close3D()">×</button>

    <iframe
      id="viewerFrame"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen>
    </iframe>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // =====================================================
  // DATABASE LUOGHI
  // AGGIUNGI I NUOVI LUOGHI SOLO QUI
  // =====================================================

  const luoghi = [

    {
      nome: "Ponte dei Ninfi",
      lat: 37.984268,
      lon: 14.581352,

      piattaforma: "sketchfab",

      modello: "f996b426f83c4e30800f1a3b4bad580c",

      descrizione: "Fotogrammetria 3D – Discovery Nebrodi"
    }
{
  nome: "Ponte Nicoletta",
  lat: 38.010992,
  lon: 14.557262,
  piattaforma: "sketchfab",
  modello: "684f69ffdd114762b74741d4b62156a8",
  descrizione: "Fotogrammetria 3D – Discovery Nebrodi"
},
  ];


  // =====================================================
  // MAPPA
  // =====================================================

  const map = L.map('map').setView([37.984268, 14.581352], 11);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  // =====================================================
  // CREAZIONE AUTOMATICA MARKER
  // =====================================================

  luoghi.forEach(function(luogo) {

    const popup = `
      <div style="text-align:center; min-width:210px;">

        <h3 style="margin-bottom:5px;">
          ${luogo.nome}
        </h3>

        <p>
          ${luogo.descrizione || ""}
        </p>

        <button
          class="open3d"
          onclick="open3D('${luogo.piattaforma}', '${luogo.modello}')"
        >
          Esplora in 3D
        </button>

      </div>
    `;

    L.marker([luogo.lat, luogo.lon])
      .addTo(map)
      .bindPopup(popup);

  });


  // =====================================================
  // VIEWER
  // =====================================================

  function open3D(piattaforma, modello) {

    const overlay = document.getElementById('viewerOverlay');
    const frame = document.getElementById('viewerFrame');

    if (piattaforma === "sketchfab") {

      frame.src =
        "https://sketchfab.com/models/" +
        modello +
        "/embed?autostart=1&ui_theme=dark";

    }

    else if (piattaforma === "luma") {

      frame.src = modello;

    }

    else {

      alert("Piattaforma non supportata.");
      return;

    }

    overlay.style.display = "flex";
  }


  function close3D() {

    const overlay = document.getElementById('viewerOverlay');
    const frame = document.getElementById('viewerFrame');

    overlay.style.display = "none";
    frame.src = "";
  }


  document.getElementById('viewerOverlay')
    .addEventListener('click', function(event) {

      if (event.target === this) {
        close3D();
      }

    });

</script>

</body>
</html>
