<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discovery Nebrodi – Mappa 3D</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #viewerOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #viewerBox {
      position: relative;
      width: 92%;
      height: 88%;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
    }

    #viewerFrame {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #closeViewer {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10000;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #111;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .open3d {
      padding: 10px 15px;
      background: #222;
      color: white;
      border: 0;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="viewerOverlay">
  <div id="viewerBox">

    <button id="closeViewer" onclick="close3D()">×</button>

    <iframe
      id="viewerFrame"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen>
    </iframe>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const luoghi = [
  {
    nome: "Ponte dei Ninfi",
    lat: 37.984268,
    lon: 14.581352,
    piattaforma: "sketchfab",
    modello: "f996b426f83c4e30800f1a3b4bad580c",
    descrizione: "Fotogrammetria 3D - Discovery Nebrodi"
  }
];

const map = L.map("map").setView([37.984268, 14.581352], 11);

// ===============================
// TIPI DI MAPPA
// ===============================

// OpenStreetMap
const mappaStandard = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
);

// Mappa topografica
const mappaTopo = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution: "Map data: &copy; OpenStreetMap contributors | OpenTopoMap"
  }
);

// Satellite
const mappaSatellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri"
  }
);


// La mappa che appare all'apertura
mappaTopo.addTo(map);


// Selettore mappe
const mappeBase = {
  "🗺️ Topografica": mappaTopo,
  "🛰️ Satellite": mappaSatellite,
  "📍 Standard": mappaStandard
};

L.control.layers(mappeBase, null, {
  position: "topright"
}).addTo(map);

luoghi.forEach(function(luogo) {

  const marker = L.marker([luogo.lat, luogo.lon]).addTo(map);

  const contenuto = document.createElement("div");

  contenuto.style.textAlign = "center";
  contenuto.style.minWidth = "210px";

  const titolo = document.createElement("h3");
  titolo.textContent = luogo.nome;

  const descrizione = document.createElement("p");
  descrizione.textContent = luogo.descrizione;

  const pulsante = document.createElement("button");
  pulsante.textContent = "Esplora in 3D";
  pulsante.className = "open3d";

  pulsante.addEventListener("click", function() {
    open3D(luogo);
  });

  contenuto.appendChild(titolo);
  contenuto.appendChild(descrizione);
  contenuto.appendChild(pulsante);

  marker.bindPopup(contenuto);

});

function open3D(luogo) {

  const overlay = document.getElementById("viewerOverlay");
  const frame = document.getElementById("viewerFrame");

  if (luogo.piattaforma === "sketchfab") {

    frame.src =
      "https://sketchfab.com/models/" +
      luogo.modello +
      "/embed?autostart=1&ui_theme=dark";

  } else if (luogo.piattaforma === "luma") {

    frame.src = luogo.modello;

  } else {

    alert("Piattaforma non supportata");
    return;

  }

  overlay.style.display = "flex";
}

function close3D() {

  document.getElementById("viewerOverlay").style.display = "none";
  document.getElementById("viewerFrame").src = "";

}

document
  .getElementById("viewerOverlay")
  .addEventListener("click", function(event) {

    if (event.target === this) {
      close3D();
    }

  });

</script>

</body>
</html>
