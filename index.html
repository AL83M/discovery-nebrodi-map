<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discovery Nebrodi – Mappa 3D</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #viewerOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #viewerBox {
      position: relative;
      width: 92%;
      height: 88%;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
    }

    #viewerFrame {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #closeViewer {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10000;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #111;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .open3d {
      padding: 10px 15px;
      background: #222;
      color: white;
      border: 0;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    /* Marker fotogrammetrie 3D */
.marker-3d {
  width: 38px;
  height: 38px;
  background: #171717;
  border: 3px solid white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.45);
}

.marker-3d::after {
  content: "⬡";
  color: white;
}
    /* ===============================
   OTTIMIZZAZIONE MOBILE replYca
   =============================== */

.leaflet-popup-content-wrapper {
  border-radius: 14px;
}

.leaflet-popup-content {
  margin: 16px;
  font-size: 15px;
  line-height: 1.4;
}

.open3d {
  width: 100%;
  padding: 12px 14px;
  font-size: 15px;
}

@media (max-width: 768px) {

  #map {
    height: 100dvh;
  }

  #viewerBox {
    width: 100%;
    height: 100%;
    border-radius: 0;
  }

  #closeViewer {
    top: 16px;
    right: 16px;
    width: 46px;
    height: 46px;
    font-size: 28px;
  }

  .leaflet-popup-content {
    min-width: 220px;
    max-width: 78vw;
  }

  .leaflet-control-layers {
    font-size: 14px;
  }

  .marker-3d {
    width: 34px;
    height: 34px;
    font-size: 18px;
  }
}
  </style>
</head>

<body>

<div id="map"></div>

<div id="viewerOverlay">
  <div id="viewerBox">

    <button id="closeViewer" onclick="close3D()">×</button>

    <iframe
      id="viewerFrame"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen>
    </iframe>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ===============================
// DATABASE LUOGHI
// ===============================

// ===============================
// CARICAMENTO LUOGHI DAL JSON
// ===============================

fetch("luoghi.json")
  .then(function(response) {
    if (!response.ok) {
      throw new Error("Errore nel caricamento di luoghi.json");
    }

    return response.json();
  })
  .then(function(luoghi) {
const bounds = [];
    luoghi.forEach(function(luogo) {

      const marker = L.marker(
        [luogo.lat, luogo.lon],
        { icon: icona3D }
      ).addTo(map);
bounds.push([luogo.lat, luogo.lon]);
      const contenuto = document.createElement("div");

      contenuto.style.textAlign = "center";
      contenuto.style.minWidth = "210px";

      const titolo = document.createElement("h3");
      titolo.textContent = luogo.nome;

      const localita = document.createElement("div");
      localita.textContent =
        (luogo.localita || "") +
        (luogo.provincia ? " · " + luogo.provincia : "");

      const descrizione = document.createElement("p");
      descrizione.textContent = luogo.descrizione || "";

      const pulsante = document.createElement("button");
      pulsante.textContent = "Esplora in 3D";
      pulsante.className = "open3d";

      pulsante.addEventListener("click", function() {
        open3D(luogo);
      });

      contenuto.appendChild(titolo);
      contenuto.appendChild(localita);
      contenuto.appendChild(descrizione);
      contenuto.appendChild(pulsante);

      marker.bindPopup(contenuto);

    });
if (bounds.length > 0) {
  map.fitBounds(bounds, {
    padding: [50, 50],
    maxZoom: 13
  });
}
  })
  .catch(function(error) {
    console.error(error);
  });

// ===============================
// MAPPA
// ===============================

const map = L.map("map").setView([37.984268, 14.581352], 11);

// Standard
const mappaStandard = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
);

// Topografica
const mappaTopo = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution: "&copy; OpenStreetMap contributors | OpenTopoMap"
  }
);

// Satellite
const mappaSatellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri"
  }
);

// Mappa iniziale
mappaTopo.addTo(map);

// Selettore
const mappeBase = {
  "🗺️ Topografica": mappaTopo,
  "🛰️ Satellite": mappaSatellite,
  "📍 Standard": mappaStandard
};

L.control.layers(mappeBase, null, {
  position: "topright"
}).addTo(map);

// ===============================
// MARKER
// ===============================
  const icona3D = L.divIcon({
  className: "",
  html: '<div class="marker-3d"></div>',
  iconSize: [44, 44],
  iconAnchor: [22, 22],
  popupAnchor: [0, -24]
});

luoghi.forEach(function(luogo) {

  const marker = L.marker(
    [luogo.lat, luogo.lon],
    { icon: icona3D }
  ).addTo(map);

  const contenuto = document.createElement("div");
  contenuto.style.textAlign = "center";
  contenuto.style.minWidth = "210px";

  const titolo = document.createElement("h3");
  titolo.textContent = luogo.nome;

  const descrizione = document.createElement("p");
  descrizione.textContent = luogo.descrizione;

  const pulsante = document.createElement("button");

  if (luogo.tipo === "panorama360") {
    pulsante.textContent = "Esplora a 360°";
  } else {
    pulsante.textContent = "Esplora in 3D";
  }

  pulsante.className = "open3d";

  pulsante.addEventListener("click", function() {
    open3D(luogo);
  });

  contenuto.appendChild(titolo);
  contenuto.appendChild(descrizione);
  contenuto.appendChild(pulsante);

  marker.bindPopup(contenuto);

});

// ===============================
// VIEWER
// ===============================

function open3D(luogo) {

  const overlay =
    document.getElementById("viewerOverlay");

  const frame =
    document.getElementById("viewerFrame");


  // ===============================
  // FOTO PANORAMICA 360°
  // ===============================

  if (
    luogo.tipo === "panorama360" &&
    luogo.foto360
  ) {

    frame.src =
      "https://cdn.pannellum.org/2.5/pannellum.htm" +
      "?panorama=" +
      encodeURIComponent(luogo.foto360) +
      "&autoLoad=true";

  }


  // ===============================
  // SKETCHFAB
  // ===============================

  else if (
    luogo.piattaforma === "sketchfab"
  ) {

    frame.src =
      "https://sketchfab.com/models/" +
      luogo.modello +
      "/embed?autostart=1&ui_theme=dark";

  }


  // ===============================
  // LUMA
  // ===============================

  else if (
    luogo.piattaforma === "luma"
  ) {

    frame.src =
      luogo.modello;

  }


  // ===============================
  // NON SUPPORTATO
  // ===============================

  else {

    alert(
      "Contenuto non supportato"
    );

    return;

  }


  overlay.style.display =
    "flex";

}

function close3D() {
  document.getElementById("viewerOverlay").style.display = "none";
  document.getElementById("viewerFrame").src = "";
}

document
  .getElementById("viewerOverlay")
  .addEventListener("click", function(event) {
    if (event.target === this) {
      close3D();
    }
  });

</script>

</body>
</html>
