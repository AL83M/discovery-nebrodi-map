<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>replYca - Gestione Archivio</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
  }

  .container {
    max-width: 760px;
    margin: 40px auto;
    padding: 30px;
  }

  h1 {
    margin-bottom: 5px;
    font-size: 36px;
  }

  .subtitle {
    color: #aaa;
    margin-bottom: 30px;
  }

  label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-size: 14px;
    color: #bbb;
  }

  input,
  select,
  textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1d1d1d;
    color: white;
    font-size: 15px;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  .tipo-box {
    margin-top: 20px;
    padding: 18px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #171717;
  }

  .buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 25px;
  }

  button {
    padding: 13px 20px;
    border: 0;
    border-radius: 8px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  button.secondary {
    background: #2a2a2a;
    color: white;
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #risultato {
    margin-top: 30px;
    padding: 20px;
    background: #1a1a1a;
    border-radius: 8px;
    white-space: pre-wrap;
    font-family: monospace;
    display: none;
    overflow-x: auto;
  }

  #stato {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    display: none;
  }

  .success {
    background: #14351f;
    color: #bdf5c9;
  }

  .error {
    background: #3b1616;
    color: #ffb7b7;
  }

  .info {
    background: #272727;
    color: #ddd;
  }

  .hidden {
    display: none;
  }
</style>
</head>

<body>

<div class="container">

  <h1>replYca</h1>
  <div class="subtitle">Gestione archivio digitale</div>

  <label for="tipo">Tipo di contenuto</label>

  <select id="tipo" onchange="aggiornaTipo()">
    <option value="fotogrammetria">⬡ Fotogrammetria 3D</option>
    <option value="panorama360">◉ Foto 360°</option>
  </select>


  <label for="nome">Nome del luogo</label>
  <input id="nome" placeholder="Ponte dei Ninfi">


  <label for="regione">Regione</label>

  <select id="regione" onchange="aggiornaProvince()">
    <option value="">Seleziona regione...</option>
    <option>Abruzzo</option>
    <option>Basilicata</option>
    <option>Calabria</option>
    <option>Campania</option>
    <option>Emilia-Romagna</option>
    <option>Friuli-Venezia Giulia</option>
    <option>Lazio</option>
    <option>Liguria</option>
    <option>Lombardia</option>
    <option>Marche</option>
    <option>Molise</option>
    <option>Piemonte</option>
    <option>Puglia</option>
    <option>Sardegna</option>
    <option>Sicilia</option>
    <option>Toscana</option>
    <option>Trentino-Alto Adige</option>
    <option>Umbria</option>
    <option>Valle d'Aosta</option>
    <option>Veneto</option>
  </select>


  <label for="provincia">Provincia</label>

  <select id="provincia">
    <option value="">Seleziona prima la regione...</option>
  </select>


  <label for="localita">Comune</label>
  <input id="localita" placeholder="San Fratello">


  <label for="lat">Latitudine</label>

  <input
    id="lat"
    type="number"
    step="any"
    placeholder="37.984268"
  >


  <label for="lon">Longitudine</label>

  <input
    id="lon"
    type="number"
    step="any"
    placeholder="14.581352"
  >


  <label for="categoria">Categoria</label>

  <select id="categoria">
    <option>Ponte storico</option>
    <option>Rudere</option>
    <option>Castello</option>
    <option>Chiesa</option>
    <option>Archeologia</option>
    <option>Monumento</option>
    <option>Paesaggio</option>
    <option>Panorama</option>
    <option>Altro</option>
  </select>


  <!-- ==========================
       FOTOGRAMMETRIA
       ========================== -->

  <div id="campi3d" class="tipo-box">

    <strong>Fotogrammetria 3D</strong>

    <label for="piattaforma">Piattaforma</label>

    <select id="piattaforma">
      <option value="sketchfab">Sketchfab</option>
    </select>


    <label for="linkModello">Link Sketchfab</label>

    <input
      id="linkModello"
      type="url"
      placeholder="https://sketchfab.com/3d-models/..."
    >

  </div>


  <!-- ==========================
       PANORAMA 360
       ========================== -->

  <div id="campi360" class="tipo-box hidden">

    <strong>Foto panoramica 360°</strong>

    <label for="link360">URL della foto 360°</label>

    <input
      id="link360"
      type="url"
      placeholder="https://esempio.it/panorama.jpg"
    >

    <p style="color:#888; font-size:13px;">
      Deve essere una foto equirettangolare 360°.
    </p>

  </div>


  <label for="descrizione">Descrizione</label>

  <textarea id="descrizione">Archivio digitale - replYca</textarea>


  <div class="buttons">

    <button type="button" onclick="genera()">
      Genera luogo
    </button>

    <button
      type="button"
      id="copia"
      class="secondary"
      onclick="copiaJSON()"
      style="display:none;"
    >
      Copia JSON
    </button>

    <button
      type="button"
      id="pubblica"
      onclick="pubblicaLuogo()"
      style="display:none;"
    >
      Pubblica sulla mappa
    </button>

  </div>


  <div id="risultato"></div>

  <div id="stato"></div>

</div>


<script>

// =====================================================
// BACKEND
// =====================================================

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbz1kw3A7PgLTbOJWyVLUfwn2_bwkeepfdRkeYsxBktNuszUq_hTjie4p5Va0sEd8bP4/exec";


// =====================================================
// PROVINCE
// =====================================================

const provincePerRegione = {

  "Abruzzo": [
    "Chieti", "L'Aquila", "Pescara", "Teramo"
  ],

  "Basilicata": [
    "Matera", "Potenza"
  ],

  "Calabria": [
    "Catanzaro", "Cosenza", "Crotone",
    "Reggio Calabria", "Vibo Valentia"
  ],

  "Campania": [
    "Avellino", "Benevento", "Caserta",
    "Napoli", "Salerno"
  ],

  "Emilia-Romagna": [
    "Bologna", "Ferrara", "Forlì-Cesena",
    "Modena", "Parma", "Piacenza",
    "Ravenna", "Reggio Emilia", "Rimini"
  ],

  "Friuli-Venezia Giulia": [
    "Gorizia", "Pordenone", "Trieste", "Udine"
  ],

  "Lazio": [
    "Frosinone", "Latina", "Rieti",
    "Roma", "Viterbo"
  ],

  "Liguria": [
    "Genova", "Imperia", "La Spezia", "Savona"
  ],

  "Lombardia": [
    "Bergamo", "Brescia", "Como", "Cremona",
    "Lecco", "Lodi", "Mantova", "Milano",
    "Monza e Brianza", "Pavia", "Sondrio", "Varese"
  ],

  "Marche": [
    "Ancona", "Ascoli Piceno", "Fermo",
    "Macerata", "Pesaro e Urbino"
  ],

  "Molise": [
    "Campobasso", "Isernia"
  ],

  "Piemonte": [
    "Alessandria", "Asti", "Biella", "Cuneo",
    "Novara", "Torino", "Verbano-Cusio-Ossola",
    "Vercelli"
  ],

  "Puglia": [
    "Bari", "Barletta-Andria-Trani",
    "Brindisi", "Foggia", "Lecce", "Taranto"
  ],

  "Sardegna": [
    "Cagliari", "Nuoro", "Oristano",
    "Sassari", "Sud Sardegna"
  ],

  "Sicilia": [
    "Agrigento", "Caltanissetta", "Catania",
    "Enna", "Messina", "Palermo",
    "Ragusa", "Siracusa", "Trapani"
  ],

  "Toscana": [
    "Arezzo", "Firenze", "Grosseto", "Livorno",
    "Lucca", "Massa-Carrara", "Pisa",
    "Pistoia", "Prato", "Siena"
  ],

  "Trentino-Alto Adige": [
    "Bolzano", "Trento"
  ],

  "Umbria": [
    "Perugia", "Terni"
  ],

  "Valle d'Aosta": [
    "Aosta"
  ],

  "Veneto": [
    "Belluno", "Padova", "Rovigo",
    "Treviso", "Venezia", "Verona", "Vicenza"
  ]

};


// =====================================================
// CAMBIO TIPO CONTENUTO
// =====================================================

function aggiornaTipo() {

  const tipo =
    document.getElementById("tipo").value;

  const campi3d =
    document.getElementById("campi3d");

  const campi360 =
    document.getElementById("campi360");


  if (tipo === "fotogrammetria") {

    campi3d.classList.remove("hidden");

    campi360.classList.add("hidden");

  } else {

    campi3d.classList.add("hidden");

    campi360.classList.remove("hidden");

  }

}


// =====================================================
// AGGIORNA PROVINCE
// =====================================================

function aggiornaProvince() {

  const regione =
    document.getElementById("regione").value;

  const selectProvincia =
    document.getElementById("provincia");

  selectProvincia.innerHTML = "";


  if (!regione) {

    const option =
      document.createElement("option");

    option.value = "";

    option.textContent =
      "Seleziona prima la regione...";

    selectProvincia.appendChild(option);

    return;
  }


  const placeholder =
    document.createElement("option");

  placeholder.value = "";

  placeholder.textContent =
    "Seleziona provincia...";

  selectProvincia.appendChild(placeholder);


  const province =
    provincePerRegione[regione] || [];


  province.forEach(function(provincia) {

    const option =
      document.createElement("option");

    option.value = provincia;

    option.textContent = provincia;

    selectProvincia.appendChild(option);

  });

}


// =====================================================
// VARIABILI
// =====================================================

let luogoGenerato = null;

let jsonGenerato = "";


// =====================================================
// GENERA
// =====================================================

function genera() {

  const tipo =
    document.getElementById("tipo").value;

  const nome =
    document.getElementById("nome").value.trim();

  const regione =
    document.getElementById("regione").value;

  const provincia =
    document.getElementById("provincia").value;

  const localita =
    document.getElementById("localita").value.trim();

  const lat =
    parseFloat(
      document.getElementById("lat").value
    );

  const lon =
    parseFloat(
      document.getElementById("lon").value
    );

  const categoria =
    document.getElementById("categoria").value;

  const descrizione =
    document.getElementById("descrizione").value.trim();


  if (
    !nome ||
    !regione ||
    !provincia ||
    !localita ||
    isNaN(lat) ||
    isNaN(lon)
  ) {

    alert(
      "Compila nome, regione, provincia, comune e coordinate."
    );

    return;
  }


  if (
    lat < -90 ||
    lat > 90 ||
    lon < -180 ||
    lon > 180
  ) {

    alert(
      "Le coordinate inserite non sono valide."
    );

    return;
  }


  // ===================================================
  // FOTOGRAMMETRIA
  // ===================================================

  if (tipo === "fotogrammetria") {

    const link =
      document.getElementById("linkModello")
        .value.trim();


    if (!link) {

      alert(
        "Inserisci il link Sketchfab."
      );

      return;
    }


    const match =
      link.match(
        /([a-f0-9]{32})(?:\?|\/|$)/i
      );


    if (!match) {

      alert(
        "Non riesco a trovare l'ID Sketchfab nel link."
      );

      return;
    }


    luogoGenerato = {

      nome: nome,

      tipo: "fotogrammetria",

      regione: regione,

      provincia: provincia,

      localita: localita,

      lat: lat,

      lon: lon,

      categoria: categoria,

      anno_scansione:
        new Date().getFullYear(),

      piattaforma: "sketchfab",

      modello: match[1],

      descrizione: descrizione,

      foto: ""

    };

  }


  // ===================================================
  // PANORAMA 360
  // ===================================================

  else {

    const link360 =
      document.getElementById("link360")
        .value.trim();


    if (!link360) {

      alert(
        "Inserisci l'URL della foto 360°."
      );

      return;
    }


    luogoGenerato = {

      nome: nome,

      tipo: "panorama360",

      regione: regione,

      provincia: provincia,

      localita: localita,

      lat: lat,

      lon: lon,

      categoria: categoria,

      anno_scansione:
        new Date().getFullYear(),

      foto360: link360,

      descrizione: descrizione

    };

  }


  jsonGenerato =
    JSON.stringify(
      luogoGenerato,
      null,
      2
    );


  const risultato =
    document.getElementById("risultato");


  risultato.textContent =
    jsonGenerato;


  risultato.style.display =
    "block";


  document.getElementById("copia")
    .style.display = "inline-block";


  document.getElementById("pubblica")
    .style.display = "inline-block";


  mostraStato(
    "Contenuto generato correttamente.",
    "success"
  );

}


// =====================================================
// COPIA JSON
// =====================================================

async function copiaJSON() {

  if (!jsonGenerato) {
    return;
  }


  try {

    await navigator.clipboard.writeText(
      jsonGenerato
    );


    const bottone =
      document.getElementById("copia");


    bottone.textContent =
      "Copiato ✓";


    setTimeout(function() {

      bottone.textContent =
        "Copia JSON";

    }, 1500);


  } catch (errore) {

    alert(
      "Non riesco a copiare automaticamente il JSON."
    );

  }

}


// =====================================================
// PUBBLICA
// =====================================================

async function pubblicaLuogo() {

  if (!luogoGenerato) {

    alert(
      "Prima premi Genera luogo."
    );

    return;
  }


  const bottone =
    document.getElementById("pubblica");


  bottone.disabled = true;

  bottone.textContent =
    "Pubblicazione...";


  mostraStato(
    "Invio al backend replYca...",
    "info"
  );


  try {

    const response =
      await fetch(
        BACKEND_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              luogoGenerato
            )

        }
      );


    const risposta =
      await response.json();


    if (!risposta.success) {

      throw new Error(
        risposta.errore ||
        "Errore durante la pubblicazione."
      );

    }


    mostraStato(
      risposta.messaggio ||
      "Pubblicato correttamente.",
      "success"
    );


    bottone.textContent =
      "Pubblicato ✓";


  } catch (errore) {


    mostraStato(
      "Errore: " +
      errore.message,
      "error"
    );


    bottone.textContent =
      "Riprova pubblicazione";


    bottone.disabled =
      false;

  }

}


// =====================================================
// STATO
// =====================================================

function mostraStato(
  messaggio,
  tipo
) {

  const stato =
    document.getElementById("stato");


  stato.textContent =
    messaggio;


  stato.className =
    tipo;


  stato.style.display =
    "block";

}

</script>

</body>
</html>
