<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>replYca - Gestione Luoghi</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
  }

  .container {
    max-width: 760px;
    margin: 40px auto;
    padding: 30px;
  }

  h1 {
    margin-bottom: 5px;
    font-size: 36px;
  }

  .subtitle {
    color: #aaa;
    margin-bottom: 30px;
  }

  label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-size: 14px;
    color: #bbb;
  }

  input,
  select,
  textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid #444;
    background: #1d1d1d;
    color: white;
    font-size: 15px;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  .buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 25px;
  }

  button {
    padding: 13px 20px;
    border: 0;
    border-radius: 7px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  button.secondary {
    background: #2a2a2a;
    color: white;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #risultato {
    margin-top: 30px;
    padding: 20px;
    background: #1a1a1a;
    border-radius: 8px;
    white-space: pre-wrap;
    font-family: monospace;
    display: none;
    overflow-x: auto;
  }

  #stato {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    display: none;
  }

  .success {
    background: #14351f;
    color: #bdf5c9;
  }

  .error {
    background: #3b1616;
    color: #ffb7b7;
  }

  .loading {
    background: #272727;
    color: #ddd;
  }
</style>
</head>

<body>

<div class="container">

  <h1>replYca</h1>
  <div class="subtitle">Gestione archivio 3D</div>

  <label for="nome">Nome del luogo</label>
  <input id="nome" placeholder="Ponte dei Ninfi">

  <label for="regione">Regione</label>
  <select id="regione" onchange="aggiornaProvince()">
    <option value="">Seleziona regione...</option>
    <option>Abruzzo</option>
    <option>Basilicata</option>
    <option>Calabria</option>
    <option>Campania</option>
    <option>Emilia-Romagna</option>
    <option>Friuli-Venezia Giulia</option>
    <option>Lazio</option>
    <option>Liguria</option>
    <option>Lombardia</option>
    <option>Marche</option>
    <option>Molise</option>
    <option>Piemonte</option>
    <option>Puglia</option>
    <option>Sardegna</option>
    <option>Sicilia</option>
    <option>Toscana</option>
    <option>Trentino-Alto Adige</option>
    <option>Umbria</option>
    <option>Valle d'Aosta</option>
    <option>Veneto</option>
  </select>

  <label for="provincia">Provincia</label>
  <select id="provincia">
    <option value="">Seleziona prima la regione...</option>
  </select>

  <label for="localita">Comune</label>
  <input id="localita" placeholder="San Fratello">

  <label for="lat">Latitudine</label>
  <input
    id="lat"
    type="number"
    step="any"
    placeholder="37.984268"
  >

  <label for="lon">Longitudine</label>
  <input
    id="lon"
    type="number"
    step="any"
    placeholder="14.581352"
  >

  <label for="categoria">Categoria</label>
  <select id="categoria">
    <option>Ponte storico</option>
    <option>Rudere</option>
    <option>Castello</option>
    <option>Chiesa</option>
    <option>Archeologia</option>
    <option>Monumento</option>
    <option>Paesaggio</option>
    <option>Altro</option>
  </select>

  <label for="piattaforma">Piattaforma 3D</label>
  <select id="piattaforma">
    <option value="sketchfab">Sketchfab</option>
    <option value="luma">Luma AI</option>
  </select>

  <label for="link">Link modello</label>
  <input
    id="link"
    type="url"
    placeholder="https://sketchfab.com/3d-models/..."
  >

  <label for="descrizione">Descrizione</label>
  <textarea id="descrizione">Fotogrammetria 3D - replYca</textarea>

  <div class="buttons">

    <button type="button" onclick="genera()">
      Genera luogo
    </button>

    <button
      type="button"
      id="copia"
      class="secondary"
      onclick="copiaJSON()"
      style="display:none;"
    >
      Copia JSON
    </button>

    <button
      type="button"
      id="pubblica"
      onclick="pubblicaLuogo()"
      style="display:none;"
    >
      Pubblica sulla mappa
    </button>

  </div>

  <div id="risultato"></div>
  <div id="stato"></div>

</div>

<script>

// =====================================================
// BACKEND replYca
// =====================================================

const BACKEND_URL =

// =====================================================
// PROVINCE PER REGIONE
// =====================================================

const provincePerRegione = {

  ],

  "Emilia-Romagna": [

    "Parma",

  "Lombardia": [

  ],

  "Marche": [

  ],

  "Molise": [

  ],

  "Piemonte": [

  "Puglia": [

  "Sardegna": [

  ],

  "Sicilia": [

  ],

  "Toscana": [

  ],

  "Trentino-Alto Adige": [

  ],

  ],

  "Valle d'Aosta": [

  ],

  "Veneto": [
    "Belluno",

    "Venezia",
    "Verona",
    "Vicenza"
  ]

};


// =====================================================
// AGGIORNA PROVINCE
// =====================================================

function aggiornaProvince() {

  const regione =
    document.getElementById("regione").value;

  const selectProvincia =
    document.getElementById("provincia");

  selectProvincia.innerHTML = "";

  if (!regione) {

    const option = document.createElement("option");

    option.value = "";
    option.textContent = "Seleziona prima la regione...";

    selectProvincia.appendChild(option);

    return;
  }

  const province =
    provincePerRegione[regione] || [];

  const placeholder =
    document.createElement("option");

  placeholder.value = "";
  placeholder.textContent = "Seleziona provincia...";

  selectProvincia.appendChild(placeholder);

  province.forEach(function(provincia) {

    const option =
      document.createElement("option");

    option.value = provincia;
    option.textContent = provincia;

    selectProvincia.appendChild(option);

  });

}


// =====================================================
// VARIABILI
// =====================================================

let luogoGenerato = null;
let jsonGenerato = "";


// =====================================================
// GENERA LUOGO
// =====================================================

function genera() {

  const nome =
    document.getElementById("nome").value.trim();

  const regione =
    document.getElementById("regione").value;

  const provincia =
    document.getElementById("provincia").value;

  const localita =
    document.getElementById("localita").value.trim();

  const lat =
    parseFloat(document.getElementById("lat").value);

  const lon =
    parseFloat(document.getElementById("lon").value);

  const categoria =
    document.getElementById("categoria").value;

  const piattaforma =
    document.getElementById("piattaforma").value;

  const link =
    document.getElementById("link").value.trim();

  const descrizione =
    document.getElementById("descrizione").value.trim();


  // Controllo campi obbligatori

  if (
    !nome ||
    !regione ||
    !provincia ||
    !localita ||
    isNaN(lat) ||
    isNaN(lon) ||
    !link
  ) {

    alert(
      "Compila nome, regione, provincia, comune, coordinate e link."
    );

    return;
  }


  // Controllo coordinate

  if (lat < -90 || lat > 90) {

    alert("Latitudine non valida.");

    return;
  }

  if (lon < -180 || lon > 180) {

    alert("Longitudine non valida.");

    return;
  }


  let modello = link;


  // =====================================================
  // ESTRAZIONE ID SKETCHFAB
  // =====================================================

  if (piattaforma === "sketchfab") {

    const match =
      link.match(/([a-f0-9]{32})(?:\?|\/|$)/i);

    if (match) {

      modello = match[1];

    } else {

      alert(
        "Non riesco a trovare l'ID del modello Sketchfab nel link."
      );

      return;
    }

  }


  // =====================================================
  // CREA OGGETTO LUOGO
  // =====================================================

  luogoGenerato = {

    nome: nome,

    regione: regione,

    provincia: provincia,

    localita: localita,

    lat: lat,

    lon: lon,

    categoria: categoria,

    anno_scansione:
      new Date().getFullYear(),

    piattaforma: piattaforma,

    modello: modello,

    descrizione: descrizione,

    foto: ""

  };


  // =====================================================
  // GENERA JSON
  // =====================================================

  jsonGenerato =
    JSON.stringify(
      luogoGenerato,
      null,
      2
    );


  const risultato =
    document.getElementById("risultato");

  risultato.textContent =
    jsonGenerato;

  risultato.style.display =
    "block";


  document.getElementById("copia")
    .style.display = "inline-block";

  document.getElementById("pubblica")
    .style.display = "inline-block";


  mostraStato(
    "Luogo generato correttamente. Controlla i dati e poi premi Pubblica sulla mappa.",
    "success"
  );

}


// =====================================================
// COPIA JSON
// =====================================================

async function copiaJSON() {

  if (!jsonGenerato) {
    return;
  }

  try {

    await navigator.clipboard.writeText(
      jsonGenerato
    );

    const bottone =
      document.getElementById("copia");

    bottone.textContent =
      "Copiato ✓";

    setTimeout(function() {

      bottone.textContent =
        "Copia JSON";

    }, 1500);

  } catch (errore) {

    alert(
      "Non sono riuscito a copiare automaticamente il JSON."
    );

  }

}


// =====================================================
// PUBBLICA SULLA MAPPA
// =====================================================

async function pubblicaLuogo() {

  if (!luogoGenerato) {

    alert(
      "Prima premi Genera luogo."
    );

    return;
  }


  const bottone =
    document.getElementById("pubblica");

  bottone.disabled = true;

  bottone.textContent =
    "Pubblicazione...";


  mostraStato(
    "Invio dati a replYca Backend...",
    "loading"
  );


  try {

    const response =
      await fetch(
        BACKEND_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(luogoGenerato)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Errore HTTP " + response.status
      );

    }


    const risposta =
      await response.json();


    if (!risposta.success) {

      throw new Error(
        risposta.errore ||
        risposta.message ||
        "Il backend ha restituito un errore."
      );

    }


    mostraStato(
      risposta.messaggio ||
      "Luogo pubblicato correttamente sulla mappa.",
      "success"
    );


    bottone.textContent =
      "Pubblicato ✓";

    bottone.disabled = true;


  } catch (errore) {

    console.error(errore);

    mostraStato(
      "Errore durante la pubblicazione: " +
      errore.message,
      "error"
    );


    bottone.textContent =
      "Riprova pubblicazione";

    bottone.disabled = false;

  }

}


// =====================================================
// MOSTRA STATO
// =====================================================

function mostraStato(messaggio, tipo) {

  const stato =
    document.getElementById("stato");

  stato.textContent =
    messaggio;

  stato.className =
    tipo;

  stato.style.display =
    "block";

}

</script>

</body>
</html>
